<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ロジックモデル描画・編集</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/viz.js"></script>
  <script src="https://unpkg.com/viz.js/full.render.js"></script>
</head>
<body>
  <textarea id="commands" placeholder="ここにチャットボットの回答を貼り付けてください" rows="5" oninput="processCommands()"></textarea>
  
  <div class="toolbar">
    <div class="toolbar-group">
      <select id="splineType" onchange="reRenderModel()" title="線のスタイル">
        <option value="line">直線</option>
        <option value="spline">曲線</option>
      </select>
      <select id="edgeType" onchange="reRenderModel()" title="エッジのスタイル">
        <option value="line">線</option>
        <option value="arrow">矢印</option>
      </select>
    </div>
    <div class="toolbar-group">
      <button onclick="clearCommands()" title="コマンド欄をクリア">クリア</button>
    </div>
    <div class="toolbar-group download-group">
      <button onclick="downloadPNG()" title="PNGとしてダウンロード">PNGダウンロード</button>
      <button onclick="downloadSVG()" title="SVGとしてダウンロード">SVGダウンロード</button>
      <button onclick="outputCommands()" title="コマンドとしてコピー">コマンドコピー</button>
    </div>
  </div>

  <div class="editing-menu">
    <button id="addElementButton" title="新しい要素を追加">要素追加</button>
    <button onclick="undoLastAction()" title="直前の作業を元に戻す">元に戻す</button>
    <button id="helpButton" title="編集ヘルプの表示">ヘルプ</button>
    <span id="copySuccess" class="copy-success">コピー成功</span>
  </div>
  
  <div id="output"></div>
  <canvas id="tempCanvas"></canvas>
  <div id="editPanel" class="edit-panel" style="display:none;"></div>

  <script src="js/downloads.js"></script>
  <script src="js/logicModel.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/commandsGenerator.js"></script>
</body>
</html>
