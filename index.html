<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ロジックモデル描画・編集</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Viz.js CDN -->
  <script src="https://unpkg.com/viz.js"></script>
  <script src="https://unpkg.com/viz.js/full.render.js"></script>
</head>
<body>
  <textarea id="commands" placeholder="ここにチャットボットの回答を貼り付けてください" rows="10" oninput="processCommands()"></textarea>
  <br>
  <div class="controls">
    <label for="splineType">線のスタイル:</label>
    <select id="splineType" onchange="reRenderModel()">
      <option value="line">直線</option>
      <option value="spline">曲線</option>
    </select>
    
    <label for="edgeType">エッジのスタイル:</label>
    <select id="edgeType" onchange="reRenderModel()">
      <option value="line">線</option>
      <option value="arrow">矢印</option>
    </select>
    
    <button onclick="clearAll()">クリア</button>
    <button id="downloadPngButton" onclick="downloadPNG()">PNGとしてダウンロード</button>
    <button id="downloadSvgButton" onclick="downloadSVG()">SVGとしてダウンロード</button>
    <button id="addElementButton">要素の追加</button>
    <button id="copyCommandsButton" onclick="outputCommands()">コマンド出力</button>
    <button id="helpButton">編集ヘルプ</button>
    <span id="copySuccess" class="copy-success">✓ コピーしました</span>

  </div>
  <div id="output"></div>
  <canvas id="tempCanvas"></canvas>

  <!-- 編集用のポップアップパネル -->
  <div id="editPanel" class="edit-panel" style="display:none;">
    <div id="editContent"></div>
  </div>

  <script src="js/downloads.js"></script>
  <script src="js/logicModel.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/commandsGenerator.js"></script>
</body>
</html>
