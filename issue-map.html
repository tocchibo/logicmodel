<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課題構造マップ編集</title>
  <link rel="stylesheet" href="css/issue-map.css">
</head>
<body>
  <main class="issue-app-shell">
    <header class="issue-topbar">
      <div class="issue-title-block">
        <h1>課題構造マップ</h1>
        <div id="issueMapMeta" class="issue-meta" aria-live="polite"></div>
      </div>
    </header>

    <section class="issue-workspace">
      <aside class="issue-panel issue-input-panel" aria-label="JSON入力">
        <div class="issue-panel-header">
          <h2>JSON</h2>
          <span id="issueMapStatus" class="issue-status" role="status" aria-live="polite"></span>
        </div>
        <div class="issue-json-actions" aria-label="JSON操作">
          <button id="loadSampleButton" type="button">サンプル読込</button>
          <button id="renderIssueMapButton" type="button">描画</button>
          <button id="saveIssueMapButton" type="button">JSON保存</button>
          <button id="loadIssueMapButton" type="button">JSON読込</button>
          <button id="copyIssueMapButton" type="button">JSONコピー</button>
          <input id="issueMapFileInput" type="file" accept="application/json" hidden>
        </div>
        <textarea id="issueMapInput" spellcheck="false" aria-label="課題構造マップJSON"></textarea>
        <div id="issueMapValidation" class="issue-validation" aria-live="polite"></div>
        <div class="issue-correction">
          <label for="issueCorrectionInstructions">修正指示</label>
          <textarea id="issueCorrectionInstructions" rows="4" aria-label="AIへの修正指示"></textarea>
          <button id="copyIssueCorrectionButton" type="button">AI修正用コピー</button>
        </div>
      </aside>

      <section class="issue-canvas-panel" aria-label="課題構造マップ表示">
        <div class="issue-canvas-header">
          <div id="issueFilterBar" class="issue-filter-bar"></div>
          <div class="issue-canvas-actions">
            <button id="addIssueNodeButton" type="button">ノード追加</button>
            <button id="addIssueEdgeButton" type="button">関係追加</button>
            <button id="saveIssueMapSvgButton" type="button">SVG保存</button>
            <button id="clearIssueSelectionButton" type="button">選択解除</button>
          </div>
        </div>
        <div id="issueMapOutput" class="issue-map-output"></div>
      </section>

      <aside class="issue-panel issue-inspector-panel" aria-label="編集パネル">
        <div class="issue-panel-header">
          <h2>編集</h2>
          <span id="issueSelectionLabel" class="issue-status"></span>
        </div>
        <div id="issueInspector" class="issue-inspector"></div>
        <div class="issue-panel-section">
          <h3>関係</h3>
          <div id="issueRelationList" class="issue-relation-list"></div>
        </div>
        <div class="issue-panel-section">
          <h3>根拠</h3>
          <div id="issueEvidenceList" class="issue-evidence-list"></div>
        </div>
      </aside>
    </section>
  </main>

  <script src="https://unpkg.com/elkjs@0.11.1/lib/elk.bundled.js"></script>
  <script src="js/issueMapApp.js"></script>
</body>
</html>
