<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ロジックモデル描画・編集</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Viz.js CDN -->
  <script src="https://unpkg.com/viz.js"></script>
  <script src="https://unpkg.com/viz.js/full.render.js"></script>
</head>
<body>
  <!-- 保存・読込ボタン（常に表示：コマンド入力フォーム等が非表示の場合でも利用可能） -->
  <div id="saveLoadContainer" style="position: fixed; top: 20px; right: 20px; z-index: 1100;">
    <button id="saveButton" title="保存" style="background: none; border: none; cursor: pointer; font-size: 24px;">
      💾
    </button>
    <button id="loadButton" title="読み込み" style="background: none; border: none; cursor: pointer; font-size: 24px;">
      📂
    </button>
    <!-- 読込用隠しファイル入力 -->
    <input type="file" id="jsonFileInput" accept="application/json" style="display: none;">
  </div>

  <textarea id="commands" placeholder="ここにチャットボットの回答を貼り付けてください" rows="5" oninput="processCommands()"></textarea>
  
  <!-- 編集メニュー：コマンドが入力されたときのみ表示 -->
  <div class="editing-menu" style="display:none;">
    <button id="addElementButton" title="新しい要素を追加">要素追加</button>
    <button id="undoButton" onclick="undoLastAction()" title="元に戻す" disabled>&#x21B6;</button>
    <button id="redoButton" onclick="redoLastAction()" title="やり直す" disabled>&#x21B7;</button>
    <button id="helpButton" title="編集ヘルプの表示">編集ヘルプ</button>
  </div>

  <!-- 描画領域：コマンドが入力されたときのみ表示 -->
  <div id="outputContainer" style="display:none;">
    <div id="output"></div>
    <!-- コントロールコンテナ／各種コントロール -->
    <div id="controlsContainer">
      <div id="styleControls">
        <select id="splineType" onchange="reRenderModel()" title="接続線の形状">
          <option value="line">直線</option>
          <option value="spline">曲線</option>
        </select>
        <select id="edgeType" onchange="reRenderModel()" title="接続線の先端">
          <option value="line">方向表示なし</option>
          <option value="arrow">方向表示あり</option>
        </select>
        <select id="edgeAttachmentStyle" onchange="reRenderModel()" title="接続位置の配置">
          <option value="fixed">線の始点終点を固定</option>
          <option value="auto">線の始点終点を自動配置</option>
        </select>
      </div>
      <div id="downloadControls">
        <button onclick="downloadPNG()" title="PNGとしてダウンロード">PNGダウンロード</button>
        <button onclick="downloadSVG()" title="SVGとしてダウンロード">SVGダウンロード</button>
        <button id="powerpointHelpButton" onclick="showPowerpointHelpPanel(event)" title="パワポ貼付ヘルプ">パワポ貼付ヘルプ</button>
      </div>
    </div>
  </div>

  <!-- 修正指示フォーム -->
  <div id="correctionForm" style="display:none;">
    <textarea id="correctionInstructions" placeholder="編集内容を踏まえ、引き続きチャットボットに修正を指示したい場合は、修正内容をここに記載した後、下のコピーボタンをクリックしてください" rows="5"></textarea>
    <button id="copyCorrectionButton" onclick="copyCorrectionInstructions()">チャットボット貼付用修正指示をコピー</button>
    <span id="copySuccess" class="copy-success">指示をコピーしました。チャット画面に戻り指示を貼り付けてください</span>
  </div>
  
  <canvas id="tempCanvas"></canvas>
  
  <!-- 関係追加時のヒント表示用ツールチップ -->
  <div id="relationTooltip" style="position: absolute; display: none; pointer-events: none; background: rgba(0,0,0,0.7); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; z-index: 2000;"></div>
  
  <!-- 編集パネル -->
  <div id="editPanel" class="edit-panel" style="display:none;"></div>

  <!-- パワーポイント貼付ヘルプ用パネル（画面中央に大きめ表示） -->
  <div id="powerpointHelpPanel" class="edit-panel" style="display:none;"></div>

  <script src="js/downloads.js"></script>
  <script src="js/logicModel.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/commandsGenerator.js"></script>
</body>
</html>
